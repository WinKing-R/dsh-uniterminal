name: CI

# 三道门禁与 prepublishOnly 完全一致：typecheck → test → build。
# 本地跑过的才算数；这里只是让它在每台机器上、每次提交都被跑一遍。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只读仓库内容，够用了：没有发布、没有写回。
permissions:
  contents: read

# 同一分支连推几次时，取消上一轮，省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: node ${{ matrix.node }}
    # 只在 Linux 上跑：宿主半边与凭据存储的关键路径是 POSIX 语义
    # （chmod 0600 属主校验、文件权限过宽即拒绝加载），这些在 Windows 上会被跳过。
    # 需要 Windows 覆盖时再加一行到 matrix 即可。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # 一个版本挂了，别把另一个版本的结果也藏起来。
      fail-fast: false
      # Node 20 已于 2026-04 EOL，ubuntu-24.04 的 runner 对它支持在收缩
      # （第一次跑时 "Use Node.js 20" 这一步就失败了）。测 22 与 24：都是 LTS，
      # 且 24 与本机开发环境一致。engines 仍写 >=20，不影响老用户。
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # pnpm 必须在 setup-node 之前装好，否则 cache: pnpm 找不到它。
      # 钉到**生成锁文件的那个确切版本**：写 11 会装 11.x 最新，
      # 一旦它对 v9.0 锁文件的解析有差异，--frozen-lockfile 就会判"锁文件过期"。
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Versions
        run: |
          node --version
          pnpm --version

      # --frozen-lockfile：锁文件与 package.json 不一致时直接失败，而不是悄悄改锁文件。
      - name: Install dependencies
        # append-only：失败时日志按时间顺序直出，不被进度条覆盖，
        # 也便于把关键几行贴出来排障。
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
